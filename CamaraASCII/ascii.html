<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visión Artificial ASCII - FACET UNT</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-color: #050505; --panel-bg: #1a1a1a;
    --accent: #2fa572; --btn-hover: #248259; --text-color: #e8eaf0;
    --neon-cyan: #00ffcc; --matrix-green: #00ff41; --amber: #ffb000; --white: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Outfit', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  
  /* ÁREA VISUAL */
  .visual-area { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; padding: 20px; overflow: hidden; }
  #video-preview { max-width: 45%; max-height: 80%; border-radius: 12px; border: 2px solid #333; display: none; transform: scaleX(-1); }
  #ascii-output { font-family: 'Consolas', 'Courier New', monospace; white-space: pre; line-height: 0.8; color: var(--neon-cyan); margin-left: 20px; font-weight: bold; text-align: center;}
  
  /* LAYOUTS */
  .layout-side #video-preview { display: block; }
  .layout-ascii #video-preview { display: none; }
  .layout-corner { align-items: center; }
  .layout-corner #video-preview { display: block; position: absolute; top: 20px; right: 20px; max-width: 200px; max-height: 150px; }

  /* PANELES INFERIORES */
  .bottom-container { background-color: var(--panel-bg); border-top-left-radius: 15px; border-top-right-radius: 15px; padding: 15px 25px; box-shadow: 0 -5px 20px rgba(0,0,0,0.5); z-index: 10; }
  
  .config-panel { display: none; flex-wrap: wrap; gap: 20px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #333; justify-content: space-between;}
  .config-panel.active { display: flex; }
  .config-group { display: flex; flex-direction: column; gap: 8px; }
  .config-group label { font-size: 13px; color: #8892a4; font-weight: 600; text-transform: uppercase;}
  select, input[type="text"], input[type="email"] { background: #2a2a2a; border: 1px solid #444; color: white; padding: 8px 12px; border-radius: 6px; font-family: 'Outfit', sans-serif; outline: none; }
  select:focus, input:focus { border-color: var(--accent); }
  input[type="range"] { accent-color: var(--accent); cursor: pointer; }

  .action-panel { display: flex; justify-content: space-between; align-items: center; gap: 15px; }
  .action-left, .action-right, .action-center { display: flex; align-items: center; gap: 10px; }
  
  button { padding: 10px 20px; border: none; border-radius: 8px; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.2s; color: white; display: flex; align-items: center; gap: 8px;}
  .btn-toggle { background-color: #444; }
  .btn-toggle.active { background-color: var(--accent); }
  .btn-toggle:hover { filter: brightness(1.2); }
  
  .btn-email { background-color: #3b71ca; }
  .btn-email:hover { background-color: #2b569b; }
  .btn-save { background-color: var(--accent); }
  .btn-save:hover { background-color: var(--btn-hover); }
  .btn-close { background-color: #cf3434; text-decoration: none; }
  .btn-close:hover { background-color: #a32727; }

  /* Hidden canvas to process frames */
  #processing-canvas { display: none; }
</style>
</head>
<body>

  <!-- ÁREA DE VIDEO Y ASCII -->
  <div class="visual-area layout-side" id="visual-area">
    <video id="video-preview" autoplay playsinline></video>
    <div id="ascii-output">Cargando cámara...</div>
  </div>

  <!-- CONTROLES INFERIORES -->
  <div class="bottom-container">
    <!-- PANEL DE CONFIGURACIÓN -->
    <div class="config-panel" id="config-panel">
      <div class="config-group">
        <label>Perfil Pantalla:</label>
        <select id="ctrl-layout">
          <option value="side">Lado a Lado</option>
          <option value="ascii">Solo ASCII</option>
          <option value="corner">Esquina</option>
        </select>
      </div>
      <div class="config-group">
        <label>Densidad Imagen:</label>
        <input type="range" id="ctrl-density" min="60" max="250" value="130" style="width: 150px;">
      </div>
      <div class="config-group">
        <label>Zoom Global (Fuente):</label>
        <input type="range" id="ctrl-zoom" min="3" max="15" value="6" style="width: 120px;">
      </div>
      <div class="config-group">
        <label>Tema Visual:</label>
        <select id="ctrl-theme">
          <option value="neon">Neon Cyan</option>
          <option value="matrix">Matrix Green</option>
          <option value="amber">Amber</option>
          <option value="white">White</option>
        </select>
      </div>
      <div class="config-group">
        <label>Texto Superior (Cartel):</label>
        <input type="text" id="ctrl-text" value="ING EN COMP - FACET" style="width: 220px; text-align: center;">
      </div>
    </div>

    <!-- PANEL DE ACCIONES -->
    <div class="action-panel">
      <div class="action-left">
        <button class="btn-toggle" id="btn-toggle">⚙️ Ajustes</button>
      </div>
      
      <div class="action-center">
        <input type="email" id="input-email" placeholder="visitante@unt.edu.ar" style="width: 220px;">
        <button class="btn-email" id="btn-email">✉️ Enviar Retrato</button>
      </div>
      
      <div class="action-right">
        <button class="btn-save" id="btn-save">💾 Guardar TXT</button>
        <a href="../index.html" class="btn-close">Cerrar</a>
      </div>
    </div>
  </div>

  <canvas id="processing-canvas"></canvas>

<script>
  // ─── CONFIGURACIÓN ALGORITMO ───
  // La misma paleta hiper-densa refinada de tu Python
  const ASCII_CHARS = " `.-':_,^=;><+!rc*/z?sLTv)J7(|Fi{C}fI31tlu[neoZ5Yxjya]2ESwqkP6h9d4VpOGbUAKXHm8RD#$Bg0MNWQ%&@".split('');
  
  // Elementos del DOM
  const video = document.getElementById('video-preview');
  const asciiOutput = document.getElementById('ascii-output');
  const canvas = document.getElementById('processing-canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const visualArea = document.getElementById('visual-area');
  
  // Controles
  const ctrlLayout = document.getElementById('ctrl-layout');
  const ctrlDensity = document.getElementById('ctrl-density');
  const ctrlZoom = document.getElementById('ctrl-zoom');
  const ctrlTheme = document.getElementById('ctrl-theme');
  const ctrlText = document.getElementById('ctrl-text');
  
  let currentAsciiText = "";

  // ─── INICIAR CÁMARA ───
  async function initCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
      video.srcObject = stream;
      video.onloadedmetadata = () => { requestAnimationFrame(renderFrame); };
    } catch (err) {
      asciiOutput.textContent = "Error: No se detectó cámara web.";
      console.error(err);
    }
  }

  // ─── BUCLE PRINCIPAL (REEMPLAZA A CV2) ───
  function renderFrame() {
    if (video.readyState !== video.HAVE_ENOUGH_DATA) {
      requestAnimationFrame(renderFrame);
      return;
    }

    const density = parseInt(ctrlDensity.value); // Ancho de la matriz ASCII
    const zoom = parseInt(ctrlZoom.value); // Tamaño de fuente
    
    // Aplicar Zoom
    asciiOutput.style.fontSize = zoom + 'px';
    
    // Calcular altura manteniendo relación de aspecto y compensando tamaño de fuente
    const aspectRatio = video.videoHeight / video.videoWidth;
    const canvasWidth = density;
    const canvasHeight = Math.floor(density * aspectRatio * 0.55); // 0.55 es el corrector de aspect ratio
    
    canvas.width = canvasWidth;
    canvas.height = canvasHeight;

    // Dibujar video (Aplicando flip horizontal para efecto espejo)
    ctx.translate(canvasWidth, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, canvasWidth, canvasHeight);
    ctx.setTransform(1, 0, 0, 1, 0, 0);

    // DIBUJAR CARTEL (Texto dinámico)
    const overlayText = ctrlText.value.trim();
    if (overlayText !== "") {
      const fontSize = Math.max(8, Math.floor(canvasWidth * 0.08));
      ctx.font = `bold ${fontSize}px sans-serif`;
      
      const textMetrics = ctx.measureText(overlayText);
      const textWidth = textMetrics.width;
      const x = (canvasWidth - textWidth) / 2;
      const y = fontSize + (canvasHeight * 0.05); // Margen superior
      
      // Rectángulo negro de fondo
      ctx.fillStyle = "black";
      ctx.fillRect(x - 5, y - fontSize, textWidth + 10, fontSize + 5);
      
      // Texto blanco
      ctx.fillStyle = "white";
      ctx.fillText(overlayText, x, y);
    }

    // MAPEO DE PÍXELES A ASCII
    const imageData = ctx.getImageData(0, 0, canvasWidth, canvasHeight);
    const pixels = imageData.data;
    let frameAscii = "";

    for (let i = 0; i < canvasHeight; i++) {
      for (let j = 0; j < canvasWidth; j++) {
        const offset = (i * canvasWidth + j) * 4;
        const r = pixels[offset];
        const g = pixels[offset + 1];
        const b = pixels[offset + 2];
        
        // Conversión a escala de grises (Luminancia)
        const brightness = (r * 0.299 + g * 0.587 + b * 0.114);
        
        // Mapeo del brillo (0-255) al array de caracteres
        const charIndex = Math.floor((brightness / 255) * (ASCII_CHARS.length - 1));
        frameAscii += ASCII_CHARS[charIndex];
      }
      frameAscii += "\n";
    }

    currentAsciiText = frameAscii;
    asciiOutput.textContent = frameAscii;

    // Llamada recursiva
    requestAnimationFrame(renderFrame);
  }

  // ─── EVENTOS DE INTERFAZ ───
  
  // Mostrar/Ocultar Ajustes
  document.getElementById('btn-toggle').addEventListener('click', function() {
    const panel = document.getElementById('config-panel');
    panel.classList.toggle('active');
    this.classList.toggle('active');
  });

  // Cambiar Layout
  ctrlLayout.addEventListener('change', (e) => {
    visualArea.className = `visual-area layout-${e.target.value}`;
  });

  // Cambiar Tema Visual
  ctrlTheme.addEventListener('change', (e) => {
    const colors = {
      'neon': 'var(--neon-cyan)',
      'matrix': 'var(--matrix-green)',
      'amber': 'var(--amber)',
      'white': 'var(--white)'
    };
    asciiOutput.style.color = colors[e.target.value];
  });

  // Guardar TXT
  document.getElementById('btn-save').addEventListener('click', () => {
    if (!currentAsciiText) return;
    const blob = new Blob([currentAsciiText], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const date = new Date().toISOString().replace(/T/, '_').replace(/\..+/, '').replace(/[-:]/g, '');
    a.href = url;
    a.download = `Stand_FACET_${date}.txt`;
    a.click();
    URL.revokeObjectURL(url);
  });

  // Enviar Email (Simulación para webs estáticas)
  document.getElementById('btn-email').addEventListener('click', function() {
    const email = document.getElementById('input-email').value;
    if (!email.includes("@")) {
      alert("Por favor, ingresa un correo válido.");
      return;
    }
    
    // NOTA PARA EL DESARROLLADOR: 
    // Como las páginas en GitHub Pages no tienen backend, no pueden conectarse por SMTP.
    // Para que este botón envíe correos reales, debes crearte una cuenta gratuita en EmailJS (emailjs.com),
    // importar su script aquí, y llamarlo enviando la variable `currentAsciiText`.
    
    // Comportamiento actual (Fallback):
    alert(`Preparando retrato para: ${email}...\n\nPara activar el envío real, enlaza una cuenta de EmailJS al botón.`);
    document.getElementById('btn-save').click(); // Le descarga el archivo en su defecto
    document.getElementById('input-email').value = "";
  });

  // Arrancar el sistema
  initCamera();

</script>
</body>
</html>
