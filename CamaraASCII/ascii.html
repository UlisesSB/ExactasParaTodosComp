<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visión Artificial ASCII - FACET UNT</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-color: #050505; --panel-bg: #1a1a1a;
    --accent: #2fa572; --btn-hover: #248259; --text-color: #e8eaf0;
    --neon-cyan: #00ffcc; --matrix-green: #00ff41; --amber: #ffb000; --white: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Outfit', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  
  /* ÁREA VISUAL */
  .visual-area { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; padding: 20px; overflow: hidden; transition: all 0.3s ease; }
  
  /* EFECTO CRT (TELEVISOR ANTIGUO) */
  .crt-effect { position: relative; }
  .crt-effect::before {
    content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
    z-index: 2; background-size: 100% 3px, 6px 100%; pointer-events: none;
  }
  .crt-effect::after {
    content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
    background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.4) 100%); z-index: 3; pointer-events: none;
  }
  .crt-effect { animation: flicker 0.15s infinite; text-shadow: 1px 0px 1px rgba(255,0,0,0.5), -1px 0px 1px rgba(0,255,255,0.5); }
  @keyframes flicker { 0% { opacity: 0.98; } 50% { opacity: 0.95; } 100% { opacity: 0.99; } }

  /* CONTENEDOR DE VIDEO DINÁMICO */
  #video-wrapper { display: none; }
  #video-preview { transform: scaleX(-1); }
  
  .layout-side #video-wrapper { display: block; position: relative; width: 45%; max-height: 80%; border-radius: 12px; border: 2px solid #333; overflow: hidden; z-index: 10;}
  .layout-side #video-preview { width: 100%; height: 100%; object-fit: cover; }
  
  .layout-corner #video-wrapper { display: block; position: absolute; top: 20px; right: 20px; width: 200px; height: 150px; border-radius: 8px; border: 2px solid #333; overflow: hidden; z-index: 10; }
  .layout-corner #video-preview { width: 100%; height: 100%; object-fit: cover; }

  .layout-free #video-wrapper { 
    display: block; position: absolute; top: 50px; left: 50px; 
    width: 320px; height: 240px; resize: both; overflow: hidden; 
    cursor: move; border: 2px dashed var(--accent); border-radius: 8px; 
    z-index: 1000; background: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
  }
  .layout-free #video-preview { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }

  #ascii-output { font-family: 'Consolas', 'Courier New', monospace; white-space: pre; line-height: 0.8; color: var(--neon-cyan); margin-left: 20px; font-weight: bold; text-align: center; z-index: 1;}
  .layout-corner #ascii-output, .layout-free #ascii-output { margin-left: 0; }

  /* PANELES INFERIORES */
  .bottom-container { background-color: var(--panel-bg); border-top-left-radius: 15px; border-top-right-radius: 15px; padding: 15px 25px; box-shadow: 0 -5px 20px rgba(0,0,0,0.5); z-index: 100; position: relative; }
  
  .config-panel { display: none; flex-wrap: wrap; gap: 20px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #333; justify-content: flex-start;}
  .config-panel.active { display: flex; }
  .config-group { display: flex; flex-direction: column; gap: 8px; }
  .config-group label { font-size: 13px; color: #8892a4; font-weight: 600; text-transform: uppercase;}
  select, input[type="text"] { background: #2a2a2a; border: 1px solid #444; color: white; padding: 8px 12px; border-radius: 6px; font-family: 'Outfit', sans-serif; outline: none; }
  select:focus, input:focus { border-color: var(--accent); }
  input[type="range"] { accent-color: var(--accent); cursor: pointer; }

  .action-panel { display: flex; justify-content: space-between; align-items: center; gap: 15px; }
  .action-left, .action-right, .action-center { display: flex; align-items: center; gap: 10px; }
  
  button { padding: 10px 20px; border: none; border-radius: 8px; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.2s; color: white; display: flex; align-items: center; gap: 8px;}
  .btn-toggle { background-color: #444; }
  .btn-toggle.active { background-color: var(--accent); }
  .btn-toggle:hover { filter: brightness(1.2); }
  
  .btn-crt { background-color: #6d28d9; }
  .btn-crt.active { background-color: #8b5cf6; box-shadow: 0 0 15px rgba(139,92,246,0.5);}
  .btn-crt:hover { background-color: #7c3aed; }

  .btn-save { background-color: var(--accent); }
  .btn-save:hover { background-color: var(--btn-hover); }
  .btn-close { background-color: #cf3434; text-decoration: none; }
  .btn-close:hover { background-color: #a32727; }

  #processing-canvas { display: none; }
</style>
</head>
<body>

  <div class="visual-area layout-side" id="visual-area">
    <div id="video-wrapper">
      <video id="video-preview" autoplay playsinline></video>
    </div>
    <div id="ascii-output">Cargando cámara...</div>
  </div>

  <div class="bottom-container">
    <div class="config-panel" id="config-panel">
      <div class="config-group">
        <label>Perfil Pantalla:</label>
        <select id="ctrl-layout">
          <option value="side">Lado a Lado</option>
          <option value="free">Cámara Libre (Arrastrable)</option>
          <option value="ascii">Solo ASCII</option>
          <option value="corner">Esquina</option>
        </select>
      </div>
      
      <!-- NUEVO: Selector de Caracteres -->
      <div class="config-group">
        <label>Estilo de Caracteres:</label>
        <select id="ctrl-charset">
          <option value="classic">Clásico (Sombras)</option>
          <option value="binary">Matrix (0 y 1)</option>
          <option value="blocks">Bloques Hacking</option>
          <option value="custom">Espejo de Texto</option>
        </select>
      </div>
      <div class="config-group" id="group-custom-text" style="display:none;">
        <label>Tu Nombre / Texto:</label>
        <input type="text" id="ctrl-custom-text" value="FACET" style="width: 120px;">
      </div>

      <div class="config-group">
        <label>Densidad Imagen:</label>
        <input type="range" id="ctrl-density" min="60" max="250" value="130" style="width: 150px;">
      </div>
      <div class="config-group">
        <label>Zoom (Fuente):</label>
        <input type="range" id="ctrl-zoom" min="3" max="15" value="6" style="width: 100px;">
      </div>
      <div class="config-group">
        <label>Tema Visual:</label>
        <select id="ctrl-theme">
          <option value="neon">Neon Cyan</option>
          <option value="matrix">Matrix Green</option>
          <option value="amber">Amber</option>
          <option value="white">White</option>
        </select>
      </div>
    </div>

    <div class="action-panel">
      <div class="action-left">
        <button class="btn-toggle" id="btn-toggle">⚙️ Ajustes</button>
        <button class="btn-crt" id="btn-crt">📺 Filtro CRT</button>
      </div>
      
      <div class="action-center">
        <label style="font-size: 13px; color: #8892a4; font-weight: 600;">CARTEL SUPERIOR:</label>
        <input type="text" id="ctrl-text" value="ING EN COMP - FACET" style="width: 250px; text-align: center; font-weight: bold;">
      </div>
      
      <div class="action-right">
        <button class="btn-save" id="btn-save">💾 Guardar TXT</button>
        <a href="../index.html" class="btn-close">Cerrar</a>
      </div>
    </div>
  </div>

  <canvas id="processing-canvas"></canvas>

<script>
  // ─── SETS DE CARACTERES ───
  const CHARSETS = {
    classic: " `.-':_,^=;><+!rc*/z?sLTv)J7(|Fi{C}fI31tlu[neoZ5Yxjya]2ESwqkP6h9d4VpOGbUAKXHm8RD#$Bg0MNWQ%&@".split(''),
    binary: "01".split(''),
    blocks: " ░▒▓█".split('')
  };
  
  const video = document.getElementById('video-preview');
  const videoWrapper = document.getElementById('video-wrapper');
  const asciiOutput = document.getElementById('ascii-output');
  const canvas = document.getElementById('processing-canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const visualArea = document.getElementById('visual-area');
  
  const ctrlLayout = document.getElementById('ctrl-layout');
  const ctrlCharset = document.getElementById('ctrl-charset');
  const ctrlCustomText = document.getElementById('ctrl-custom-text');
  const ctrlDensity = document.getElementById('ctrl-density');
  const ctrlZoom = document.getElementById('ctrl-zoom');
  const ctrlTheme = document.getElementById('ctrl-theme');
  const ctrlText = document.getElementById('ctrl-text');
  
  let currentAsciiText = "";

  async function initCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
      video.srcObject = stream;
      video.onloadedmetadata = () => { requestAnimationFrame(renderFrame); };
    } catch (err) {
      asciiOutput.textContent = "Error: No se detectó cámara web.";
    }
  }

  function renderFrame() {
    if (video.readyState !== video.HAVE_ENOUGH_DATA) { requestAnimationFrame(renderFrame); return; }

    const density = parseInt(ctrlDensity.value); 
    const zoom = parseInt(ctrlZoom.value); 
    asciiOutput.style.fontSize = zoom + 'px';
    
    const aspectRatio = video.videoHeight / video.videoWidth;
    const canvasWidth = density;
    const canvasHeight = Math.floor(density * aspectRatio * 0.55); 
    canvas.width = canvasWidth; canvas.height = canvasHeight;

    ctx.translate(canvasWidth, 0); ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, canvasWidth, canvasHeight);
    ctx.setTransform(1, 0, 0, 1, 0, 0);

    const overlayText = ctrlText.value.trim();
    if (overlayText !== "") {
      const fontSize = Math.max(8, Math.floor(canvasWidth * 0.08));
      ctx.font = `bold ${fontSize}px sans-serif`;
      const textWidth = ctx.measureText(overlayText).width;
      const x = (canvasWidth - textWidth) / 2;
      const y = fontSize + (canvasHeight * 0.05); 
      
      ctx.fillStyle = "black"; ctx.fillRect(x - 5, y - fontSize, textWidth + 10, fontSize + 5);
      ctx.fillStyle = "white"; ctx.fillText(overlayText, x, y);
    }

    // Configurar qué set de caracteres usar
    let activeCharset = CHARSETS.classic;
    if (ctrlCharset.value === 'binary') activeCharset = CHARSETS.binary;
    else if (ctrlCharset.value === 'blocks') activeCharset = CHARSETS.blocks;
    else if (ctrlCharset.value === 'custom') {
      let txt = ctrlCustomText.value.trim();
      if(txt === "") txt = " ";
      activeCharset = txt.split('');
    }

    const imageData = ctx.getImageData(0, 0, canvasWidth, canvasHeight);
    const pixels = imageData.data;
    let frameAscii = "";

    for (let i = 0; i < canvasHeight; i++) {
      for (let j = 0; j < canvasWidth; j++) {
        const offset = (i * canvasWidth + j) * 4;
        const brightness = (pixels[offset] * 0.299 + pixels[offset + 1] * 0.587 + pixels[offset + 2] * 0.114);
        
        const charIndex = Math.floor((brightness / 255) * (activeCharset.length - 1));
        frameAscii += activeCharset[charIndex];
      }
      frameAscii += "\n";
    }

    currentAsciiText = frameAscii;
    asciiOutput.textContent = frameAscii;
    requestAnimationFrame(renderFrame);
  }

  // ─── LÓGICA PARA ARRASTRAR EL VIDEO ───
  let isDragging = false, dragStartX, dragStartY;

  videoWrapper.addEventListener('mousedown', (e) => {
    if (ctrlLayout.value !== 'free') return;
    const rect = videoWrapper.getBoundingClientRect();
    if (e.clientX > rect.right - 20 && e.clientY > rect.bottom - 20) return;
    
    isDragging = true;
    dragStartX = e.clientX - videoWrapper.offsetLeft;
    dragStartY = e.clientY - videoWrapper.offsetTop;
    videoWrapper.style.cursor = 'grabbing';
  });

  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    videoWrapper.style.left = (e.clientX - dragStartX) + 'px';
    videoWrapper.style.top = (e.clientY - dragStartY) + 'px';
  });

  window.addEventListener('mouseup', () => {
    isDragging = false;
    if (ctrlLayout.value === 'free') videoWrapper.style.cursor = 'move';
  });

  // ─── EVENTOS DE BOTONES ───
  document.getElementById('btn-toggle').addEventListener('click', function() {
    document.getElementById('config-panel').classList.toggle('active');
    this.classList.toggle('active');
  });

  document.getElementById('btn-crt').addEventListener('click', function() {
    visualArea.classList.toggle('crt-effect');
    this.classList.toggle('active');
  });

  ctrlCharset.addEventListener('change', (e) => {
    document.getElementById('group-custom-text').style.display = (e.target.value === 'custom') ? 'flex' : 'none';
  });

  ctrlLayout.addEventListener('change', (e) => {
    visualArea.className = `visual-area layout-${e.target.value}`;
    if (document.getElementById('btn-crt').classList.contains('active')) {
      visualArea.classList.add('crt-effect');
    }
    if(e.target.value === 'free') {
      videoWrapper.style.left = '50px'; videoWrapper.style.top = '50px';
    } else {
      videoWrapper.style.left = ''; videoWrapper.style.top = '';
    }
  });

  ctrlTheme.addEventListener('change', (e) => {
    const colors = { 'neon': 'var(--neon-cyan)', 'matrix': 'var(--matrix-green)', 'amber': 'var(--amber)', 'white': 'var(--white)' };
    asciiOutput.style.color = colors[e.target.value];
  });

  document.getElementById('btn-save').addEventListener('click', () => {
    if (!currentAsciiText) return;
    const blob = new Blob([currentAsciiText], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `Stand_FACET_${Date.now()}.txt`; a.click(); URL.revokeObjectURL(url);
  });

  initCamera();
</script>
</body>
</html>
