<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TERMINAL DE CIBERMETRÍA ESPACIAL</title>
    <style>
        :root {
            --main-color: #00ff41;
            --dark-color: #003b00;
            --bg-color: #030303;
        }
        body {
            background-color: var(--bg-color);
            color: var(--main-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            overflow: hidden;
            display: grid;
            grid-template-columns: 350px 1fr 400px;
            height: 100vh;
            transition: color 0.5s;
        }
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            z-index: 999;
            background-size: 100% 3px;
            pointer-events: none;
        }
        .panel {
            border: 1px solid var(--dark-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            background: rgba(0, 10, 0, 0.6);
            z-index: 10;
            position: relative;
        }
        .panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: var(--main-color);
            box-shadow: 0 0 10px var(--main-color);
        }
        h1, h2, h3 { 
            text-shadow: 0 0 8px var(--main-color); 
            margin-top: 0; 
            border-bottom: 1px dashed var(--main-color);
            padding-bottom: 5px;
        }
        button {
            background-color: var(--dark-color);
            color: var(--main-color);
            border: 1px solid var(--main-color);
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
            text-shadow: 0 0 5px var(--main-color);
            transition: all 0.2s;
            width: 100%;
        }
        button:hover { 
            background-color: var(--main-color); 
            color: black; 
            box-shadow: 0 0 15px var(--main-color);
        }
        .control-group { margin-bottom: 15px; background: rgba(0,0,0,0.5); padding: 10px; border: 1px solid var(--dark-color);}
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px;}
        input[type="range"] { width: 100%; accent-color: var(--main-color); cursor: ew-resize; }
        select, .toggle-btn {
            width: 100%; padding: 8px;
            background-color: black;
            color: var(--main-color);
            border: 1px solid var(--dark-color);
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
        }
        .toggle-btn { text-align: center; margin-top: 5px; box-sizing: border-box;}
        .toggle-btn.active { background-color: var(--main-color); color: black; font-weight: bold;}
        
        #radar-container {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: radial-gradient(circle, var(--dark-color) 0%, black 70%);
        }
        canvas {
            border-radius: 50%;
            box-shadow: 0 0 50px var(--dark-color), inset 0 0 50px var(--dark-color);
        }
        .target-overlay {
            position: absolute;
            top: 20px; left: 20px;
            font-size: 12px;
            opacity: 0.7;
        }
        .table-container { flex-grow: 1; overflow-y: auto; margin-bottom: 10px;}
        table { width: 100%; border-collapse: collapse; font-size: 13px;}
        th, td { padding: 8px 4px; text-align: left; border-bottom: 1px solid var(--dark-color); }
        th { background-color: var(--dark-color); position: sticky; top: 0;}
        tr { cursor: crosshair; transition: background 0.2s; }
        tr:hover { background-color: rgba(0, 255, 65, 0.2); }
        tr.targeted { background-color: var(--main-color); color: black; font-weight: bold; }
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: black; }
        ::-webkit-scrollbar-thumb { background: var(--main-color); }
    </style>
</head>
<body>

    <!-- PANEL IZQUIERDO -->
    <div class="panel">
        <h2 class="blink">>> SYSTEM_READY</h2>
        <button id="btnConnect">INICIAR ENLACE USB [RX/TX]</button>
        
        <div style="display: flex; gap: 5px;">
            <button id="btnAudio" class="toggle-btn" style="margin:0;">AUDIO: OFF</button>
            <button id="btnExport" style="margin:0;">EXPORTAR LOG</button>
        </div>
        <br>
        
        <div class="control-group">
            <label>TEMA VISUAL DE INTERFAZ:</label>
            <select id="themeSelector">
                <option value="matrix">Matrix (Terminal Green)</option>
                <option value="cyberpunk">Cyberpunk (Neon Cyan)</option>
                <option value="alert">Defcon 1 (Crimson Red)</option>
            </select>
        </div>

        <div class="control-group">
            <label>FILTRO DISTANCIA: <span id="distValue">15</span>m</label>
            <input type="range" id="distFilter" min="1" max="30" value="15">
        </div>

        <div class="control-group">
            <label>FILTRO FABRICANTE:</label>
            <select id="brandFilter">
                <option value="ALL">>> MOSTRAR TODO EL ESPECTRO</option>
                <option value="Apple">Apple Inc.</option>
                <option value="Android">Sistemas Android / Google</option>
                <option value="Samsung">Samsung Electronics</option>
                <option value="Xiaomi">Xiaomi</option>
                <option value="Microsoft">Microsoft Corp.</option>
                <option value="Wearable">Wearables (Relojes/Tags)</option>
                <option value="MAC_Rotativa">Dispositivos Ocultos</option>
            </select>
        </div>

        <div class="control-group">
            <label>MEMORIA CACHÉ (Persistencia): <span id="persistValue">10</span>s</label>
            <input type="range" id="persistFilter" min="2" max="30" value="10">
        </div>

        <div class="control-group">
            <label>FORMATO MAC:</label>
            <div id="macToggle" class="toggle-btn active">MOSTRAR MAC COMPLETA</div>
        </div>

        <div style="margin-top: auto; border-top: 1px solid var(--main-color); padding-top: 10px;">
            <p>ESTADO RX: <span id="status" class="blink">Esperando enlace...</span></p>
            <p>NODOS ACTIVOS EN ÁREA: <span id="nodeCount" style="font-size: 24px; font-weight: bold;">0</span></p>
        </div>
    </div>

    <!-- PANEL CENTRAL -->
    <div id="radar-container" class="panel" style="padding: 0; background-color: transparent;">
        <div class="target-overlay">
            OBJETIVO FIJADO: <span id="targetMacDisplay">NINGUNO</span><br>
            DISTANCIA RELATIVA: <span id="targetDistDisplay">--</span><br>
            AZIMUTH: <span id="targetAzimuthDisplay">--</span>°
        </div>
        <canvas id="radarCanvas" width="700" height="700"></canvas>
    </div>

    <!-- PANEL DERECHO -->
    <div class="panel">
        <h3>>> VOLCADO_HEXADECIMAL</h3>
        <p style="font-size: 11px; margin-top: -10px;">Haz clic en un nodo para fijar objetivo</p>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 45%;">MAC_ADDR</th>
                        <th style="width: 20%;">DIST</th>
                        <th style="width: 35%;">INTELIGENCIA</th>
                    </tr>
                </thead>
                <tbody id="dataTable"></tbody>
            </table>
        </div>
    </div>

    <script>
        // --- VARIABLES GLOBALES ---
        let radarColor = '#00ff41'; 
        let radarData = {}; 
        let sweepAngle = 0;
        let showFullMac = true;
        let targetMac = null; 
        let knownMacs = new Set(); 

        const canvas = document.getElementById('radarCanvas');
        const ctx = canvas.getContext('2d');
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const maxRadarDist = 20; 

        // --- SISTEMA DE SONIDO ---
        let audioCtx = null;
        let soundEnabled = false;
        let sonarIntervalId = null;

        function playSonarPing() {
            if (!soundEnabled || !audioCtx) return;
            const time = audioCtx.currentTime;

            const delay = audioCtx.createDelay();
            delay.delayTime.value = 0.45; 
            const feedback = audioCtx.createGain();
            feedback.gain.value = 0.45; 
            const lowpass = audioCtx.createBiquadFilter();
            lowpass.type = 'lowpass';
            lowpass.frequency.value = 900; 

            delay.connect(lowpass);
            lowpass.connect(feedback);
            feedback.connect(delay);
            delay.connect(audioCtx.destination);

            function generarArmonico(freq, type, duration, vol, conEco) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, time);
                osc.frequency.exponentialRampToValueAtTime(freq * 0.98, time + duration);
                gain.gain.setValueAtTime(0, time);
                gain.gain.linearRampToValueAtTime(vol, time + 0.01); 
                gain.gain.exponentialRampToValueAtTime(0.001, time + duration); 

                osc.connect(gain);
                gain.connect(audioCtx.destination); 
                if (conEco) gain.connect(delay);
                osc.start(time);
                osc.stop(time + duration);
            }

            generarArmonico(1200, 'sine', 2.0, 0.3, true);   
            generarArmonico(2400, 'sine', 1.2, 0.1, true);  
            generarArmonico(600, 'triangle', 2.0, 0.2, true); 

            const subOsc = audioCtx.createOscillator();
            const subGain = audioCtx.createGain();
            subOsc.type = 'sine';
            subOsc.frequency.setValueAtTime(150, time);
            subOsc.frequency.exponentialRampToValueAtTime(30, time + 0.4); 
            subGain.gain.setValueAtTime(0, time);
            subGain.gain.linearRampToValueAtTime(0.4, time + 0.02);
            subGain.gain.exponentialRampToValueAtTime(0.001, time + 0.4);
            subOsc.connect(subGain);
            subGain.connect(audioCtx.destination);
            subOsc.start(time);
            subOsc.stop(time + 0.4);
        }

        function playDetectionAlert() {
            if (!soundEnabled || !audioCtx) return;
            const time = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square'; 
            osc.frequency.setValueAtTime(2000, time);
            osc.frequency.setValueAtTime(3500, time + 0.05);

            gain.gain.setValueAtTime(0, time);
            gain.gain.linearRampToValueAtTime(0.08, time + 0.01);
            gain.gain.linearRampToValueAtTime(0, time + 0.04);
            gain.gain.linearRampToValueAtTime(0.08, time + 0.06);
            gain.gain.linearRampToValueAtTime(0, time + 0.09);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(time);
            osc.stop(time + 0.1);
        }

        // Evento Botón Audio
        document.getElementById('btnAudio').addEventListener('click', (e) => {
            soundEnabled = !soundEnabled;
            e.target.innerText = soundEnabled ? "AUDIO: ON" : "AUDIO: OFF";
            e.target.classList.toggle('active');

            if (soundEnabled) {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                playSonarPing(); 
                if (sonarIntervalId) clearInterval(sonarIntervalId);
                sonarIntervalId = setInterval(playSonarPing, 4000); 
            } else {
                if (sonarIntervalId) clearInterval(sonarIntervalId);
            }
        });

        // --- EXPORTAR CSV ---
        document.getElementById('btnExport').addEventListener('click', () => {
            let csv = "MAC,DISTANCIA_METROS,INFORMACION,ULTIMA_VEZ_VISTO\n";
            for (const [mac, device] of Object.entries(radarData)) {
                let dateStr = new Date(device.lastSeen).toLocaleTimeString();
                csv += `${mac},${device.dist.toFixed(2)},${device.info},${dateStr}\n`;
            }
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', 'Inteligencia_RF_Export.csv');
            a.click();
        });

        // --- SISTEMA DE TEMAS Y CONTROLES UI ---
        const themes = {
            matrix: { main: '#00ff41', dark: '#003b00' },
            cyberpunk: { main: '#00f3ff', dark: '#003b5c' },
            alert: { main: '#ff003c', dark: '#3b0000' }
        };

        document.getElementById('themeSelector').addEventListener('change', (e) => {
            const t = themes[e.target.value];
            document.documentElement.style.setProperty('--main-color', t.main);
            document.documentElement.style.setProperty('--dark-color', t.dark);
            radarColor = t.main;
        });

        document.getElementById('distFilter').addEventListener('input', (e) => { document.getElementById('distValue').innerText = e.target.value; });
        document.getElementById('persistFilter').addEventListener('input', (e) => { document.getElementById('persistValue').innerText = e.target.value; });
        
        document.getElementById('macToggle').addEventListener('click', (e) => {
            showFullMac = !showFullMac;
            e.target.innerText = showFullMac ? "MOSTRAR MAC COMPLETA" : "OCULTAR MAC (PRIVACIDAD)";
            e.target.classList.toggle('active');
            updateTable(); 
        });

        function setTarget(mac) {
            targetMac = (targetMac === mac) ? null : mac; 
            updateTable(); 
        }

        // --- MOTOR DEL RADAR ---
        function drawRadar() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--dark-color').trim();
            ctx.lineWidth = 1;
            for(let i=1; i<=5; i++) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, (canvas.width/2) * (i/5), 0, Math.PI * 2);
                ctx.stroke();
            }
            ctx.beginPath(); ctx.moveTo(centerX, 0); ctx.lineTo(centerX, canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, centerY); ctx.lineTo(canvas.width, centerY); ctx.stroke();

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(sweepAngle);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, -centerX);
            ctx.lineWidth = 3;
            ctx.strokeStyle = radarColor;
            ctx.shadowBlur = 15;
            ctx.shadowColor = radarColor;
            ctx.stroke();
            
            let gradient = ctx.createLinearGradient(0, 0, 100, 0);
            ctx.fillStyle = radarColor;
            ctx.globalAlpha = 0.15;
            ctx.beginPath();
            ctx.moveTo(0,0);
            ctx.arc(0, 0, centerX, -Math.PI/2, -Math.PI/2 - 0.4, true);
            ctx.fill();
            ctx.restore();
            ctx.globalAlpha = 1.0;
            ctx.shadowBlur = 0;

            sweepAngle += 0.03;

            const maxDistFilter = parseFloat(document.getElementById('distFilter').value);
            const brandF = document.getElementById('brandFilter').value;

            document.getElementById('targetMacDisplay').innerText = "NINGUNO";
            document.getElementById('targetDistDisplay').innerText = "--";
            document.getElementById('targetAzimuthDisplay').innerText = "--";

            for (const [mac, device] of Object.entries(radarData)) {
                if (device.dist > maxDistFilter) continue;
                if (brandF !== "ALL" && !device.info.includes(brandF)) continue;

                let r = (device.dist / maxRadarDist) * centerX;
                if (r > centerX - 15) r = centerX - 15; 

                const x = centerX + r * Math.cos(device.angle);
                const y = centerY + r * Math.sin(device.angle);

                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fillStyle = radarColor;
                ctx.shadowBlur = 10;
                ctx.shadowColor = radarColor;
                ctx.fill();
                ctx.shadowBlur = 0;
                
                if (mac === targetMac) {
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.lineTo(x, y);
                    ctx.strokeStyle = 'white';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([5, 5]);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    ctx.strokeStyle = 'white';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x - 10, y - 10, 20, 20);

                    let azimuthDegrees = Math.round((device.angle * 180 / Math.PI + 90 + 360) % 360);
                    document.getElementById('targetMacDisplay').innerText = mac;
                    document.getElementById('targetDistDisplay').innerText = device.dist.toFixed(1) + "m";
                    document.getElementById('targetAzimuthDisplay').innerText = azimuthDegrees;
                } else {
                    ctx.font = '10px Courier New';
                    ctx.fillText(`[${device.dist.toFixed(1)}]`, x + 8, y + 3);
                }
            }
            requestAnimationFrame(drawRadar);
        }

        // --- ACTUALIZACIÓN DE TABLA ---
        function updateTable() {
            const tableBody = document.getElementById('dataTable');
            const nodeCount = document.getElementById('nodeCount');
            const now = Date.now();
            
            const maxDistFilter = parseFloat(document.getElementById('distFilter').value);
            const brandF = document.getElementById('brandFilter').value;
            const persistTime = parseInt(document.getElementById('persistFilter').value) * 1000;

            let count = 0;
            let htmlBuffer = "";

            let sortedDevices = Object.entries(radarData).sort((a, b) => a[1].dist - b[1].dist);

            for (const [mac, device] of sortedDevices) {
                if (now - device.lastSeen > persistTime) {
                    delete radarData[mac];
                    if(targetMac === mac) targetMac = null; 
                    continue;
                }

                if (device.dist > maxDistFilter) continue;
                if (brandF !== "ALL" && !device.info.includes(brandF)) continue;

                count++;
                
                let displayMac = showFullMac ? mac : mac.substring(0,8) + ":XX:XX:XX";
                let rowClass = (mac === targetMac) ? "class='targeted'" : "";

                htmlBuffer += `<tr ${rowClass} onclick="setTarget('${mac}')">
                    <td>${displayMac}</td>
                    <td>${device.dist.toFixed(1)}m</td>
                    <td>${device.info}</td>
                </tr>`;
            }

            tableBody.innerHTML = htmlBuffer;
            nodeCount.innerText = count;
        }

        setInterval(updateTable, 500);

        // --- CONEXIÓN SERIAL USB ---
        document.getElementById('btnConnect').addEventListener('click', async () => {
            const statusTxt = document.getElementById('status');
            try {
                const port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                
                statusTxt.innerText = "ESCANEO ACTIVO";
                statusTxt.classList.remove('blink');
                document.getElementById('btnConnect').style.display = "none";
                
                const textDecoder = new TextDecoderStream();
                const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
                const reader = textDecoder.readable.getReader();
                
                let buffer = "";
                let recording = false;

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    
                    buffer += value;
                    let lines = buffer.split('\n');
                    buffer = lines.pop(); 

                    for (let line of lines) {
                        line = line.trim();
                        if (line === "---START_JSON---") { recording = true; continue; }
                        if (line === "---END_JSON---") { recording = false; continue; }
                        
                        if (recording && line.startsWith("{")) {
                            try {
                                const data = JSON.parse(line);
                                
                                // Detección de MAC Nueva para el "Bip" digital
                                if (!knownMacs.has(data.mac)) {
                                    knownMacs.add(data.mac);
                                    playDetectionAlert(); 
                                }

                                if (!radarData[data.mac]) {
                                    data.angle = Math.random() * Math.PI * 2; 
                                } else {
                                    data.angle = radarData[data.mac].angle; 
                                }
                                data.lastSeen = Date.now();
                                radarData[data.mac] = data;
                            } catch (e) { }
                        }
                    }
                }
            } catch (err) {
                statusTxt.innerText = "ACCESO DENEGADO / ERROR";
                statusTxt.style.color = "red";
            }
        });

        drawRadar();
    </script>
</body>
</html>
