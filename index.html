<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exactas Para Todos · Computación</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0a0e1a; --surface: #111827; --accent: #4f9cf9; --accent2: #a78bfa; --text: #e8eaf0; }
  body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
  .header { text-align: center; margin-bottom: 50px; }
  .header h1 { font-family: 'Playfair Display', serif; font-size: 40px; margin: 0; }
  .header h1 span { color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; width: 100%; max-width: 900px; padding: 20px; box-sizing: border-box; }
  .card { background: var(--surface); border: 1px solid rgba(79,156,249,0.15); border-radius: 16px; padding: 30px; text-align: center; text-decoration: none; color: var(--text); transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
  .card:hover { transform: translateY(-5px); border-color: var(--accent); box-shadow: 0 8px 25px rgba(79,156,249,0.2); }
  .card .icon { font-size: 40px; margin-bottom: 15px; }
  .card h2 { margin: 0 0 10px 0; font-size: 22px; color: var(--accent); }
  .card p { font-size: 14px; color: #8892a4; margin: 0; }
</style>
</head>
<body>
  <div class="header">
    <h1>Expo <span>Exactas</span> 2026</h1>
    <p>Proyectos de Ingeniería en Computación</p>
  </div>
  <div class="grid">
    <a href="Mapa/mapa-ingenieros.html" class="card">
      <div class="icon">🌍</div>
      <h2>Mapa de Egresados</h2>
      <p>Visualizador global de ingenieros recibidos.</p>
    </a>
    <a href="Carreras/index.html" class="card">
      <div class="icon">🎓</div>
      <h2>Plan de Carreras</h2>
      <p>Información sobre las asignaturas y correlativas.</p>
    </a>
    <a href="Escaner/index.html" class="card">
      <div class="icon">📱</div>
      <h2>Escáner</h2>
      <p>Sistema de lectura y validación interactiva.</p>
    </a>
  </div>
</body>
</html>
